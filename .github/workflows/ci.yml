name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    name: Backend · Unit-Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-automation/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legal-automation/backend/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/ -q --ignore=tests/integration

  backend-integration:
    name: Backend · Integrationstests (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-automation/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal_test
          POSTGRES_PASSWORD: legal_test
          POSTGRES_DB: legal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legal_test -d legal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legal-automation/backend/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Integrationstests (Migrationen + API-Flows)
        env:
          RUN_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379/9
        run: python -m pytest tests/integration/ -q

  frontend:
    name: Frontend · Typecheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-automation/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: legal-automation/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
