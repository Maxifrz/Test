services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./portal:/usr/share/nginx/portal:ro
      # Öffentliche Kanzlei-Website (statischer vHost, siehe nginx.conf)
      - ../website:/usr/share/nginx/website:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - legal_net

  postgres:
    # pgvector/pgvector = offizielles Postgres 16 + vector-Extension
    # (benötigt für Migration 0010 / KI-Wissensgraph; Drop-in-kompatibel)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    restart: unless-stopped
    networks:
      - legal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - legal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./storage:/storage
      - ./backend/jwt_private.pem:/run/secrets/jwt_private_key:ro
      - ./backend/jwt_public.pem:/run/secrets/jwt_public_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal_net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./storage:/storage
      - ./backend/jwt_private.pem:/run/secrets/jwt_private_key:ro
      - ./backend/jwt_public.pem:/run/secrets/jwt_public_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal_net
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "transcription,email,default"]

  worker-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal_net
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--scheduler", "celery.beat.PersistentScheduler"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - legal_net

  # Lokaler LLM-Server für die KI-Rechtsrecherche (V3.0). Opt-in:
  #   docker compose --profile ki up -d
  #   docker compose exec ollama ollama pull phi3:mini nomic-embed-text
  # Dazu in .env: KI_ENABLED=true (Modelle je Hardware: KI_LLM_MODEL)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ki"]
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped
    networks:
      - legal_net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  ollamadata:
    driver: local

networks:
  legal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
