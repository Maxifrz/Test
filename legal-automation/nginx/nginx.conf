worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # Öffentliches Gläubiger-Portal: streng limitiert (Spam-Schutz, unauthentifiziert)
    limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/m;

    # --- Redirect HTTP → HTTPS ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'none';" always;

        # --- Öffentliches Gläubiger-Portal (unauthentifiziert, eng begrenzt) ---
        # Statische Portal-App; eigene, strenge Ratenbegrenzung auf /api/public/.
        location /portal/ {
            alias /usr/share/nginx/portal/;
            index index.html;
            try_files $uri $uri/ /portal/index.html;
        }

        location /api/public/ {
            limit_req zone=portal burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API proxy with rate limiting ---
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transkriptions-Endpunkte: POST /api/transcriptions ist der Audio-Upload
        # (große Bodies + lange Übertragungszeit); GET-Listen laufen hier mit durch.
        location /api/transcriptions {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 500m;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # Bankdaten-Import (CAMT/MT940-Dateien bis einige MB)
        location = /api/finance/import {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 20m;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket ---
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # --- Frontend SPA ---
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =====================================================================
    # Öffentliche Kanzlei-Website (statisch, DSGVO: keine Cookies/Tracking)
    #
    # VOR GO-LIVE: server_name auf die echte Domain setzen (z. B.
    # www.kanzlei-eckert.de) und ein eigenes Zertifikat hinterlegen.
    # Solange der Hostname nicht matcht, beantwortet der obige Default-
    # vHost (internes Tool) die Anfragen — Website und Tool bleiben strikt
    # getrennt, nur /api/public/ (Kontaktformular, Gläubiger-Portal) und
    # /portal/ sind von der Website aus erreichbar.
    # =====================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.kanzlei-eckert.example kanzlei-eckert.example;  # ⟨ echte Domain eintragen ⟩

        ssl_certificate     /etc/nginx/ssl/server.crt;   # ⟨ eigenes Website-Zertifikat ⟩
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # style-src 'unsafe-inline': die Website nutzt Inline-Styles (Prototyp-
        # Konvertierung); frame-src erlaubt NUR die Klick-zum-Laden-OSM-Karte.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; form-action 'self';" always;

        root /usr/share/nginx/website;
        index index.html;

        # Statische Assets aggressiv cachen (Dateinamen sind stabil)
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Kontaktformular + Gläubiger-Portal-API (strenges Rate-Limit, unauth.)
        location /api/public/ {
            limit_req zone=portal burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gläubiger-Portal-App (CTA "Zum Gläubiger-Portal" auf der Website)
        location /portal/ {
            alias /usr/share/nginx/portal/;
            index index.html;
            try_files $uri $uri/ /portal/index.html;
        }

        # Alles andere als saubere .html-Seiten ausliefern (/team → team.html)
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /index.html;
    }
}
