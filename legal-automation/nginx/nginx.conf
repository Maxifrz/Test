worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Globale Obergrenze; einzelne Locations heben sie gezielt an.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # Öffentliches Gläubiger-Portal: streng limitiert (Spam-Schutz, unauthentifiziert)
    limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # --- HTTP: nur ACME-Challenge + Redirect auf HTTPS ---
    server {
        listen 80;
        server_name _;

        # Let's-Encrypt http-01. Ohne diese Location kann ein Zertifikat nicht
        # ausgestellt oder erneuert werden, weil / pauschal umgeleitet wird.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn perip 64;

        include /etc/nginx/snippets/security-headers.conf;

        # --- Betriebsmetriken: nur intern, nie oeffentlich ---
        location = /api/metrics {
            include /etc/nginx/snippets/security-headers.conf;
            allow 172.20.0.0/16;
            allow 127.0.0.1;
            deny all;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # --- Öffentliches Gläubiger-Portal (unauthentifiziert, eng begrenzt) ---
        # Statische Portal-App; eigene, strenge Ratenbegrenzung auf /api/public/.
        location /portal/ {
            include /etc/nginx/snippets/security-headers.conf;
            alias /usr/share/nginx/portal/;
            index index.html;
            try_files $uri $uri/ /portal/index.html;
        }

        location /api/public/ {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=portal burst=5 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # --- API proxy with rate limiting ---
        location = /api/auth/login {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=login burst=3 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # Transkriptions-Endpunkte: POST /api/transcriptions ist der Audio-Upload
        # (große Bodies + lange Übertragungszeit); GET-Listen laufen hier mit durch.
        location ^~ /api/transcriptions {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 500m;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # Dokumenten-Upload (Scans/PDF fuer OCR + Volltextsuche)
        location ^~ /api/documents {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=upload burst=10 nodelay;
            client_max_body_size 100m;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # Bankdaten-Import (CAMT/MT940-Dateien bis einige MB)
        location = /api/finance/import {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 20m;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # KI-Ingestion: ganze Gesetzestexte koennen die 2m-Standardgrenze reissen
        location = /api/ki/ingest {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 25m;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_read_timeout 300s;
        }

        location /api/ {
            include /etc/nginx/snippets/security-headers.conf;
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # --- WebSocket ---
        location /ws/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # --- Frontend SPA ---
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =====================================================================
    # Öffentliche Kanzlei-Website (statisch, DSGVO: keine Cookies/Tracking)
    #
    # VOR GO-LIVE: server_name auf die echte Domain setzen (z. B.
    # www.kanzlei-eckert.de) und ein eigenes Zertifikat hinterlegen.
    # Solange der Hostname nicht matcht, beantwortet der obige Default-
    # vHost (internes Tool) die Anfragen — Website und Tool bleiben strikt
    # getrennt, nur /api/public/ (Kontaktformular, Gläubiger-Portal) und
    # /portal/ sind von der Website aus erreichbar.
    # =====================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.kanzlei-eckert.example kanzlei-eckert.example;  # ⟨ echte Domain eintragen ⟩

        ssl_certificate     /etc/nginx/ssl/server.crt;   # ⟨ eigenes Website-Zertifikat ⟩
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn perip 64;

        include /etc/nginx/snippets/security-headers-website.conf;

        root /usr/share/nginx/website;
        index index.html;

        # Statische Assets aggressiv cachen (Dateinamen sind stabil).
        # Die Header werden hier erneut eingebunden, weil das eigene
        # add_header (Cache-Control) sonst ALLE geerbten Header verwirft.
        location /assets/ {
            include /etc/nginx/snippets/security-headers-website.conf;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        # Kontaktformular + Gläubiger-Portal-API (strenges Rate-Limit, unauth.)
        location /api/public/ {
            include /etc/nginx/snippets/security-headers-website.conf;
            limit_req zone=portal burst=5 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # Gläubiger-Portal-App (CTA "Zum Gläubiger-Portal" auf der Website)
        location /portal/ {
            include /etc/nginx/snippets/security-headers-website.conf;
            alias /usr/share/nginx/portal/;
            index index.html;
            try_files $uri $uri/ /portal/index.html;
        }

        # Alles andere als saubere .html-Seiten ausliefern (/team → team.html)
        location / {
            include /etc/nginx/snippets/security-headers-website.conf;
            try_files $uri $uri.html $uri/ =404;
        }

        # 404 mit korrektem Status ausliefern (vorher: index.html unter 404 —
        # Soft-404, das Suchmaschinen als gueltige Seite indexieren).
        error_page 404 /404.html;
        location = /404.html {
            include /etc/nginx/snippets/security-headers-website.conf;
            internal;
        }
    }
}
