# Gemeinsame Sicherheits-Header für das interne Tool.
#
# WICHTIG: nginx vererbt add_header NICHT in einen location-Block, der selbst
# ein add_header enthält — dort werden ALLE geerbten Header verworfen. Deshalb
# liegen sie hier als Snippet und werden in jedem betroffenen Block per
# `include` erneut gesetzt.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
