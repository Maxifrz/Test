# Sicherheits-Header für den öffentlichen Website-vHost.
# style-src 'unsafe-inline': die Website nutzt Inline-Styles (Prototyp-
# Konvertierung); frame-src erlaubt NUR die Klick-zum-Laden-OSM-Karte.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; form-action 'self';" always;
