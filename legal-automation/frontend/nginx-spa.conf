# Auslieferung der gebauten SPA. Der aeussere nginx (legal-automation/nginx)
# terminiert TLS, setzt die Sicherheits-Header und proxyt hierher.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite haengt einen Content-Hash an die Dateinamen -> unbegrenzt cachebar.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html NIE cachen, sonst zeigt der Browser nach einem Deployment
    # weiter auf die alten, geloeschten Asset-Dateien.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Client-seitiges Routing: unbekannte Pfade an die SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
